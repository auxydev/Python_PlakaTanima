[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "plakatanima"
version = "0.1.0"
description = "Otoparklar için plaka tanıma, araç sınıflandırma ve giriş/çıkış yönetim sistemi"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kagan Yildirim" }]
requires-python = ">=3.11"
keywords = ["alpr", "anpr", "plaka", "otopark", "ocr", "yolo", "pyside6"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Turkish",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "onnxruntime>=1.19",
    "fast-alpr>=0.4",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "platformdirs>=4.0",
    "tomli-w>=1.0",
    "PySide6>=6.7",
    "qtawesome>=1.3",
    "openpyxl>=3.1",
    "pillow>=10.0",
]

[project.optional-dependencies]
# Ultralytics YOLO (.pt) modelleri ile araç tespiti. AGPL-3.0 lisanslıdır ve PyTorch kurar.
yolo = ["ultralytics>=8.3"]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.6"]

[project.scripts]
plakatanima = "plakatanima.cli:main"

[project.urls]
Repository = "https://github.com/auxydev/Python_PlakaTanima"

[tool.hatch.build.targets.wheel]
packages = ["src/plakatanima"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001", # Türkçe karakterler (ı, İ ...) belirsiz karakter olarak işaretlenmesin
    "RUF002",
    "RUF003",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
qt_api = "pyside6"
